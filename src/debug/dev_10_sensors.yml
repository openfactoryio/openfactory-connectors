# ---------------------------------------------------------------------------------------
# 🏭 OpenFactory Device Configuration File
#
# To be used in the Dev Container of this repo
#
# Deploy with:
#   docker run -d --name virtual-opcua-sensor-10 -p 4842:4840 -e NUM_SENSORS=10 ghcr.io/openfactoryio/virtual-opcua-sensor
# ---------------------------------------------------------------------------------------

devices:
  vtempsens-1000:
    uuid: VIRTUAL-OPCUA-SENS-1000

    connector:
      type: opcua

      server:
        uri: opc.tcp://${CONTAINER_IP}:4842
        subscription:                       # Server-level defaults
          publishing_interval: 10           # ms, for subscription object
          queue_size: 1                     # default per monitored item
          sampling_interval: 0              # ms, 0 = event-driven if supported

      variables:
        temp:
          browse_path: 0:Root/0:Objects/2:Sensors/2:TemperatureSensor1/2:Temperature
          tag: Temperature
        hum:
          browse_path: 0:Root/0:Objects/2:Sensors/2:TemperatureSensor1/2:Humidity
          tag: Humidity

      constants:
        sensor_model: 
          browse_path: 0:Root/0:Objects/2:Sensors/2:TemperatureSensor1/2:SensorModel
          tag: SensorModel

      methods:
        sensor_methods:
          browse_path: 0:Root/0:Objects/2:Sensors/2:TemperatureSensor1

